<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Sergio Gael García Landa — Full-Stack Developer, Tech Lead y PM">
  <title>Sergio Gael García Landa — Full-Stack Developer, Tech Lead y PM</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="280" rx="20"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <rect width="1200" height="280" fill="url(#glow)"/>
    <rect y="0" width="1200" height="4" fill="url(#accent)"/>

    <!-- Left: identity -->
    <text x="64" y="92" class="mono" font-size="18" fill="#38BDF8">~/dahlanGale</text>
    <text x="64" y="148" class="sans" font-size="46" font-weight="700" fill="#F1F5F9">Sergio Gael García Landa</text>
    <text x="64" y="190" class="sans" font-size="22" fill="#94A3B8">Full-Stack · Frontend · Backend · Tech Lead · PM</text>
    <rect x="64" y="216" width="120" height="4" rx="2" fill="url(#accent)"/>

    <!-- Right: code window -->
    <g transform="translate(800 56)">
      <rect width="336" height="168" rx="12" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="22" cy="20" r="5" fill="#F87171"/>
      <circle cx="40" cy="20" r="5" fill="#FBBF24"/>
      <circle cx="58" cy="20" r="5" fill="#34D399"/>
      <g class="mono" font-size="15">
        <text x="22" y="64"><tspan fill="#C084FC">const</tspan><tspan fill="#E2E8F0"> stack = {</tspan></text>
        <text x="40" y="90"><tspan fill="#7DD3FC">api</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">"NestJS + Prisma"</tspan><tspan fill="#E2E8F0">,</tspan></text>
        <text x="40" y="114"><tspan fill="#7DD3FC">web</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">"React · Next.js"</tspan><tspan fill="#E2E8F0">,</tspan></text>
        <text x="40" y="138"><tspan fill="#7DD3FC">apps</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">"React Native · Electron"</tspan></text>
        <text x="22" y="160" fill="#E2E8F0">};<tspan class="cursor" fill="#38BDF8"> ▍</tspan></text>
      </g>
    </g>
  </g>
</svg>
